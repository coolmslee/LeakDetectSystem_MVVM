; camera.sample.ini - 카메라 설정 샘플 파일
; 이 파일을 복사하여 camera.ini 로 이름을 변경한 후 환경에 맞게 수정하세요.
; Copy this file to camera.ini and adjust values to match your environment.

[CAM1]
; 카메라 사용 여부 (1=사용, 0=미사용)
Use=1
; 카메라 IP 주소
Ip=192.168.0.101
; 영상 포맷 (Mono8 / Mono10 / Mono12 / RGB8 / BGR8)
VideoFormat=Mono8
; 노출 시간 (단위: μs, 범위: 100 ~ 1000000)
ExposureTime=10000
; 게인 (범위: 0 ~ 1000)
Gain=100
; 타임아웃 사용 여부 (1=사용, 0=미사용)
TimeoutEnabled=1
; 타임아웃 시간 (단위: ms, 범위: 100 ~ 60000)
Timeout=3000

[CAM2]
